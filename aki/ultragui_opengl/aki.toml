# ultragui's OpenGL 3.3 core backends, ported from ugui/rhi/opengl/opengl_rhi.cc
# and ugui/backends/ugui_impl_opengl3.{h,cc}: the Rhi over a GLFW window, and
# the draw-data renderer for hosts that own their GL context. GL entry points
# are loaded through a get-proc-address at run time; nothing links libGL.
# See ../PORTING.md.
[package]
name = "ultragui_opengl"
kind = "lib"
version = "0.1.0"
description = "libultragui's OpenGL RHI and draw-data renderer in aki"

[dependencies]
ultragui = { path = "../ultragui" }
ultragui_glfw = { path = "../ultragui_glfw" }

[dev-dependencies]
ultragui_testing = { path = "../ultragui_testing" }
ultragui_scenes = { path = "../ultragui_scenes" }
