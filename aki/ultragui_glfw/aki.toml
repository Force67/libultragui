# ultragui's GLFW platform (ugui/platform/platform_glfw.cc), ported to aki: a
# Platform over a GLFW window, with a hand-written binding of the GLFW calls
# it and the windowed RHIs make. See ../PORTING.md.
[package]
name = "ultragui_glfw"
kind = "lib"
version = "0.1.0"
description = "libultragui's GLFW platform in aki"

[dependencies]
ultragui = { path = "../ultragui" }

[dev-dependencies]
ultragui_testing = { path = "../ultragui_testing" }

[build]
link = ["-lglfw"]
