# libultragui's core, ported from ugui/ (C++) to aki. Everything here needs only
# FreeType, HarfBuzz and libc: no C++ compiler. Layout runs on an aki flexbox
# engine (src/layout/flex_tree.aki) that gives yoga's results bit for bit;
# third_party/yoga is only the test oracle (tools/yoga_fuzz.cc).
# Optional backends (GLFW, Vulkan, OpenGL, D3D11/12, Lua, Lottie, video, audio)
# are separate packages that depend on this one. See ../PORTING.md.
[package]
name = "ultragui"
kind = "lib"
version = "0.1.0"
description = "libultragui's core in aki: style, text, widgets ECS, seams for RHI/platform/scripting"

[dev-dependencies]
ultragui_testing = { path = "../ultragui_testing" }

[build]
link = ["-lfreetype", "-lharfbuzz", "-lm"]

# C `long` differs per OS (FreeType's FT_Long, FT_Pos, FT_Fixed): see
# src/sys/freetype.aki.
[build.os.linux]
sources = ["os/linux"]

[build.os.android]
sources = ["os/android"]

[build.os.macos]
sources = ["os/macos"]

[build.os.freebsd]
sources = ["os/freebsd"]

[build.os.windows]
sources = ["os/windows"]
