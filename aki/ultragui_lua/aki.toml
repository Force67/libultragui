# libultragui's Lua scripting runtime in aki: ugui/scripting/lua_runtime.cc as
# LuaRuntime (a ScriptRuntime), and the ugui.* bindings for widgets, .uganim
# animations and audio (lua_widgets, lua_anim, lua_audio). The Lottie and video
# bindings live in ultragui_lua_lottie and ultragui_lua_video, so a Lua user
# does not link rlottie and pl_mpeg. See ../PORTING.md.
#
# Lua 5.4 comes from the system: the dev shell's lua5_4 (pkg-config lua5.4).
# The C++ build compiles Lua 5.4.7 from its release archive on Windows
# (cmake/BundledDeps.cmake); for an aki Windows build put a static liblua.a
# for the target on the linker path (or vendor lua-5.4.7/src and list its .c
# files, minus lua.c and luac.c, under [build.os.windows] c_sources).
[package]
name = "ultragui_lua"
kind = "lib"
version = "0.1.0"
description = "libultragui's Lua 5.4 scripting runtime in aki"

[dependencies]
ultragui = { path = "../ultragui" }

[build]
link = ["-llua", "-lm"]

[build.os.linux]
link = ["-ldl"]
