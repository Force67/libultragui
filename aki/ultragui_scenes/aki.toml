# The scene the OpenGL and D3D11 backends' tests draw, through the Rhi and as
# draw data (no C++ counterpart: tools/rhi_scene.cc and tools/draw_data_scene.cc
# are its twins), shared by those packages' tests. A dev-dependency.
[package]
name = "ultragui_scenes"
kind = "lib"
version = "0.1.0"
description = "Test scenes shared by the ultragui GPU backend packages"

[dependencies]
ultragui = { path = "../ultragui" }
