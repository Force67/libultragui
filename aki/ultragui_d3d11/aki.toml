# ultragui's Direct3D 11 backends, ported from ugui/rhi/d3d11/d3d11_rhi.cc,
# ugui/rhi/d3d11/d3d_shader_compiler.{h,cc}, ugui/backends/ugui_impl_dx11.{h,cc}
# and ugui/backends/ugui_impl_win32.{h,cc}: the Rhi over a GLFW window, the
# draw-data renderer for hosts that own a D3D11 device, and (Windows only) the
# Win32 message translation for the host platform. On Windows it links the SDK's
# d3d11 and dxgi; on Linux DXVK-native, which turns the calls into Vulkan (run
# with DXVK_WSI_DRIVER=GLFW), and vkd3d-utils supplies D3DCompile, loaded by name
# as in the C++. See ../PORTING.md.
[package]
name = "ultragui_d3d11"
kind = "lib"
version = "0.1.0"
description = "libultragui's Direct3D 11 RHI, draw-data renderer and Win32 input in aki"

[dependencies]
ultragui = { path = "../ultragui" }
ultragui_glfw = { path = "../ultragui_glfw" }

[dev-dependencies]
ultragui_testing = { path = "../ultragui_testing" }
ultragui_scenes = { path = "../ultragui_scenes" }

[build]

[build.os.linux]
c_sources = ["csrc/d3dcompile_abi.c"]
link = ["-ldxvk_d3d11", "-ldxvk_dxgi"]

[build.os.windows]
link = ["-ld3d11", "-ldxgi", "-luser32"]
sources = ["os/windows"]
